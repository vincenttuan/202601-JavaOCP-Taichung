<!DOCTYPE html>
<html>
	<head>
		<meta charset="UTF-8">
		<title>訪客留言版</title>
		<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/purecss@3.0.0/build/pure-min.css">
	</head>
	<body style="padding: 10pt">
		<form class="pure-form" method="post" action="/JavaWeb/servlet/guestbook">
			<fieldset>
				<legend>訪客留言版</legend>
				<label>暱稱:</label>
				<input name="nickname" placeholder="請輸入暱稱" required > <p />
				<label>留言:</label> <br />
				<textarea rows="5" cols="27" name="content" required ></textarea> <p />
				<button type="reset" title="按我一下可以清除欄位資訊">清除</button>
				<button type="submit" title="按我一下可以送出留言內容">送出</button>
				
				<a href="/JavaWeb/servlet/query/guestbook" title="按我一下可以查看所有留言內容">查看留言</a>
			</fieldset>
		</form>
		
	</body>
</html>
