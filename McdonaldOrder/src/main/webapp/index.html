<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>麥當勞餐點管理系統</title>

	<link rel="stylesheet" href="/McdonaldOrder/css/app.css">
	<link rel="stylesheet" href="/McdonaldOrder/chat/chat.css">
	
</head>

<body class="order-page">

	<!-- 首頁主要內容 -->
	<main class="order-container">

		<!-- 歡迎區 -->
		<div class="page-title">

			<h1>🍔 歡迎使用麥當勞餐點管理系統</h1>

			<p>
				提供餐點訂購、購物車、訂單管理與商品管理功能
			</p>

		</div>

		<!-- 功能分類 -->
		<section class="category-section">

			<div class="category-title">
				<h2>系統功能</h2>
				<span>FUNCTIONS</span>
			</div>


			<div class="product-grid">

				<!-- 餐點訂購 -->
				<article class="product-card">

					<div class="product-image-box">
						<div class="no-image">
							🍔
						</div>
					</div>

					<div class="product-info">

						<h3 class="product-name">
							餐點訂購
						</h3>

						<div class="product-meta">
							<div class="product-price">
								Order
							</div>

							<span class="stock">
								線上點餐
							</span>
						</div>

						<div class="order-form">

							<a class="order-button"
							   href="/McdonaldOrder/order"
							   style="display:block;text-align:center;text-decoration:none;">
								開始訂餐
							</a>

						</div>

					</div>

				</article>


				<!-- 購物車 -->
				<article class="product-card">

					<div class="product-image-box">
						<div class="no-image">
							🛒
						</div>
					</div>

					<div class="product-info">

						<h3 class="product-name">
							購物車
						</h3>

						<div class="product-meta">
							<div class="product-price">
								Cart
							</div>

							<span class="stock">
								餐點確認
							</span>
						</div>

						<div class="order-form">

							<a class="order-button"
							   href="/McdonaldOrder/order?action=cart"
							   style="display:block;text-align:center;text-decoration:none;">
								查看購物車
							</a>

						</div>

					</div>

				</article>


				<!-- 歷史訂單 -->
				<article class="product-card">

					<div class="product-image-box">
						<div class="no-image">
							📋
						</div>
					</div>

					<div class="product-info">

						<h3 class="product-name">
							歷史訂單
						</h3>

						<div class="product-meta">
							<div class="product-price">
								History
							</div>

							<span class="stock">
								訂單查詢
							</span>
						</div>

						<div class="order-form">

							<a class="order-button"
							   href="/McdonaldOrder/order?action=history"
							   style="display:block;text-align:center;text-decoration:none;">
								查看訂單
							</a>

						</div>

					</div>

				</article>


				<!-- 商品管理 -->
				<article class="product-card">

					<div class="product-image-box">
						<div class="no-image">
							📦
						</div>
					</div>

					<div class="product-info">

						<h3 class="product-name">
							商品管理
						</h3>

						<div class="product-meta">
							<div class="product-price">
								Product
							</div>

							<span class="stock">
								後台管理
							</span>
						</div>

						<div class="order-form">

							<a class="order-button"
							   href="/McdonaldOrder/products?action=list"
							   style="display:block;text-align:center;text-decoration:none;">
								管理商品
							</a>

						</div>

					</div>

				</article>

			</div>

		</section>

	</main>
	
	<!-- 浮動 Chat 按鈕 -->
	<a href="#" id="chatButton" class="floating-chat" title="線上客服">
		<span>💬</span>
	</a>
	
	<!-- 浮動線上客服視窗 -->
	<section id="chatPanel" class="chat-panel">
		<div class="chat-header">
			<div>
				<strong>線上客服</strong>
				<span id="chatStatus">尚未連線</span>
			</div>
			<button id="chatCloseButton" type="button" title="關閉">x</button>
		</div>
		
		<div id="chatMessages" class="chat-messages">
			<div class="chat-welcome">
				您好 ! 請問需要什麼協助 ?
			</div>
		</div>
		
		<div class="chat-input-area">
			<input id="chatInput" type="text" maxlength="200" placeholder="請輸入訊息..." disabled />
			<button id="chatSendButton" type="button" disabled>送出</button>
		</div>
	</section>
	
	<script>
		
		var socket = null;
		var chatButton = document.getElementById('chatButton');
		var chatPanel = document.getElementById('chatPanel'); 
		var chatCloseButton = document.getElementById('chatCloseButton');
		var chatStatus = document.getElementById('chatStatus');
		var chatMessages = document.getElementById('chatMessages');
		var chatInput = document.getElementById('chatInput');
		var chatSendButton = document.getElementById('chatSendButton');
		
		// 按下右下角的 Chat 按鈕
		chatButton.onclick = function(e) {
			// 將預設的 button 行為拿掉, 為的是要自訂 button 行為
			e.preventDefault();
			chatPanel.classList.add('chat-panel-open');
			
			// 判斷 websocket 連線
			if(socket == null || socket.readyState == WebSocket.CLOSED) {
				connectWebSocket();
			} else if(socket.readyState == WebSocket.OPEN) {
				chatInput.disabled = false;
				chatSendButton.disabled = false;
				chatInput.focus(); // 將游標移到訊息輸入框
			}
		}
		
		// 關閉聊天室
		chatCloseButton.onclick = function(e) {
			// 將預設的 button 行為拿掉, 為的是要自訂 button 行為
			e.preventDefault();
			chatPanel.classList.remove('chat-panel-open');
		}
		
		// 建立 WebSocket 連線
		function connectWebSocket() {
			var wsurl = 'ws://localhost:8080/McdonaldOrder/ws/chat';
			socket = new WebSocket(wsurl);
			chatStatus.innerHTML = '連線中...';
			
			// WebSocket 建立成功
			socket.onopen = function() {
				chatStatus.innerHTML = '客服 online';
				chatInput.disabled = false;
				chatSendButton.disabled = false;
				chatInput.focus(); // 將游標移到訊息輸入框
			};
			
			// 收到伺服端訊息
			socket.onmessage = function(e) {
				//chatMessages.insertAdjacentHTML('afterbegin', e.data);
				showMessage(e.data);
			};
			
			// WebSocket 關閉
			socket.onclose = function() {
				chatStatus.innerHTML = '尚未連線';
				chatInput.disabled = true;
				chatSendButton.disabled = true;
			};
			
			// WebSocket 錯誤
			socket.onerror = function() {
				chatStatus.innerHTML = '連線錯誤';
			};
			
		}
		
		// 顯示收到訊息
		function showMessage(data) {
			var separator = data.indexOf('|');
			var sender = data.substring(0, separator);
			var content = data.substring(separator + 1);
			var messageBox = document.createElement('div');
			
			if(sender == 'CUSTOMER') {
				messageBox.className = 'chat-message chat-message-customer';
			} else {
				messageBox.className = 'chat-message chat-message-staff';
			}
			
			messageBox.innerText = content;
			chatMessages.appendChild(messageBox);
			chatMessages.scrollTop = chatMessages.scrollHeight; // 將滾動條滾到最底部
			
		}
		
		// 按下送出鈕
		chatSendButton.onclick = function() {
			var message = chatInput.value.trim();
			
			if(message != '' && socket.readyState == WebSocket.OPEN) {
				socket.send('CUSTOMER|' + message);
				chatInput.value = '';
				chatInput.focus();
			}
			
		};
		
		
	</script>
	
</body>
</html>
